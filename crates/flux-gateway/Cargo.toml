[package]
name = "flux-gateway"
version = "0.3.4"
edition = "2021"
authors = ["Aryntra Project"]
description = "HTTP Gateway adapter for Aryntra Flux"

[lib]
name = "flux_gateway"
path = "src/lib.rs"

[[bin]]
name = "flux-gateway"
path = "src/main.rs"

[dependencies]
flux-core = { path = "../flux-core" }
tokio = { version = "1.38", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
axum = "0.7"
tower = "0.4"
tower-http = { version = "0.5", features = ["trace", "cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "1.0"
uuid = { version = "1.8", features = ["v4", "serde"] }

[dev-dependencies]
tokio = { version = "1.38", features = ["full", "test-util"] }
reqwest = { version = "0.12", features = ["json"] }
