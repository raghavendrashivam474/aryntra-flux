[package]
name = "flux-core"
version = "0.1.0"
edition = "2021"

[dependencies]
socket2 = { version = "0.5", features = ["all"] }
uuid = { version = "1.6", features = ["v4", "serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.35", features = ["full"] }
mdns-sd = "0.9"
anyhow = "1.0"
log = "0.4"
dirs = "5.0"

# S1.3 Transport dependencies
async-trait = "0.1"
bincode = "1.3"
thiserror = "1.0"

# S1.4 File transfer dependencies
sha2 = "0.10"

[dev-dependencies]
tempfile = "3.8"
